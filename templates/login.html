<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — GPA Daily Report</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#003366; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#fff; border-radius:12px; padding:2.5rem 2rem; max-width:360px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,.35); }
  .login-logo { background:#003366; border-radius:8px; padding:.75rem 1rem; margin-bottom:1.5rem; text-align:center; }
  .login-logo h5 { color:#C89010; margin:0; font-size:1rem; letter-spacing:.04em; }
  .login-logo p  { color:#aac4e0; margin:0; font-size:.78rem; }
  .pin-input { letter-spacing:.4em; font-size:1.4rem; text-align:center; }
  .btn-login { background:#003366; color:#fff; border:none; width:100%; padding:.65rem; font-size:1rem; border-radius:8px; }
  .btn-login:hover { background:#005B99; color:#fff; }
  .error-box { background:#fff3cd; border:1px solid #ffc107; border-radius:6px; padding:.5rem .9rem; font-size:.85rem; color:#856404; margin-bottom:1rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <h5>PT. GARUDA PRIMA AKSARA</h5>
    <p>Daily Report System v2</p>
  </div>
  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:.85rem;">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username"
             autocomplete="username" autofocus required>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" style="font-size:.85rem;">PIN <span class="text-muted fw-normal">(4 digits)</span></label>
      <input type="password" name="pin" class="form-control pin-input"
             placeholder="••••" maxlength="4" inputmode="numeric"
             pattern="[0-9]{4}" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-login">Sign In</button>
  </form>
</div>
</body>
</html>
